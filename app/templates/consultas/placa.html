{% extends 'base.html' %}
{% block page_title %} · Consulta de placa{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Consulta rápida</span>
    <h2>Consultar placa</h2>
    <p class="muted" style="margin-top: 12px;">Pesquise os dados básicos do veículo sem precisar abrir um orçamento ou uma O.S.</p>
  </div>
</div>

<div class="card" style="max-width: 760px;">
  <form id="plate-lookup-form">
    <label for="plate-lookup-input">Placa
      <div class="inline-form">
        <input id="plate-lookup-input" type="text" inputmode="text" autocomplete="off" maxlength="7" placeholder="ABC1D23" style="text-transform: uppercase;" required>
        <button type="submit" id="plate-lookup-button">Consultar</button>
      </div>
    </label>
  </form>
  <p class="muted" id="plate-lookup-status" style="margin-top: 16px;">Use o formato AAA0X00 ou AAA9999.</p>

  <div id="plate-lookup-result" class="data-card" style="display: none; margin-top: 28px;">
    <span class="eyebrow">Resultado</span>
    <h3 id="plate-lookup-vehicle" style="margin-top: 8px;"></h3>
    <p class="muted" style="margin-top: 8px;">Placa consultada</p>
    <strong id="plate-lookup-plate" style="display: block; margin-top: 4px; color: var(--color-graphite); font-size: 24px;"></strong>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById('plate-lookup-form');
  const input = document.getElementById('plate-lookup-input');
  const button = document.getElementById('plate-lookup-button');
  const status = document.getElementById('plate-lookup-status');
  const result = document.getElementById('plate-lookup-result');
  const vehicle = document.getElementById('plate-lookup-vehicle');
  const plate = document.getElementById('plate-lookup-plate');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const normalized = (input.value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    result.style.display = 'none';
    if (normalized.length !== 7) {
      status.textContent = 'Informe uma placa válida com 7 caracteres.';
      return;
    }

    button.disabled = true;
    status.textContent = 'Consultando placa...';
    try {
      const response = await fetch(`/api/veiculos/placa/${encodeURIComponent(normalized)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Não foi possível consultar a placa.');
      input.value = data.placa || normalized;
      plate.textContent = data.placa || normalized;
      vehicle.textContent = data.veiculo_descricao || 'Veículo sem descrição disponível.';
      result.style.display = 'block';
      status.textContent = 'Consulta realizada com sucesso.';
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
{% endblock %}

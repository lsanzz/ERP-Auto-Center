{% extends 'base.html' %}
{% block content %}
<div class="page-header"><div><h2>{{ 'Editar orçamento' if budget else 'Novo orçamento' }}</h2></div></div>
<div class="card">
  <form method="post">
    <div class="form-grid-2">
      <label>Cliente
        <select name="client_id" required>
          <option value="">Selecione</option>
          {% for client in clients %}
          <option value="{{ client.id }}" {% if budget and budget.client_id == client.id %}selected{% endif %}>{{ client.nome }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Placa
        <div class="inline-form">
          <input id="placa" type="text" name="placa" value="{{ budget.placa if budget else '' }}" placeholder="ABC1D23" style="text-transform: uppercase;">
          <button type="button" class="secondary" id="buscar-placa">Buscar</button>
        </div>
      </label>
      <label>Veículo / modelo<input id="veiculo_descricao" type="text" name="veiculo_descricao" value="{{ budget.veiculo_descricao if budget else '' }}" placeholder="Gol 1.6, Onix LT, etc." style="text-transform: uppercase;"></label>
      {% if budget %}
      <label>Status
        <select name="status">
          {% for status in statuses %}
          <option value="{{ status }}" {% if budget.status == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </label>
      {% endif %}
      <label>Desconto<input type="number" step="0.01" name="desconto" value="{{ budget.desconto if budget else 0 }}"></label>
      <label>Validade<input type="date" name="validade" value="{{ budget.validade.isoformat() if budget and budget.validade else (budget_default_date.isoformat() if budget_default_date else iso_today()) }}"></label>
    </div>
    <p class="muted" id="placa-status">Consulte a placa para preencher a descrição do veículo.</p>
    <label>Observações<textarea name="observacoes">{{ budget.observacoes if budget else '' }}</textarea></label>
    <div class="actions"><button type="submit">Salvar</button><a class="button secondary" href="{{ url_for('web.budgets_index') }}">Cancelar</a></div>
  </form>
</div>
<script>
(() => {
  const plateInput = document.getElementById('placa');
  const vehicleDescription = document.getElementById('veiculo_descricao');
  const plateButton = document.getElementById('buscar-placa');
  const plateStatus = document.getElementById('placa-status');

  async function consultarPlaca() {
    const placa = (plateInput.value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    if (placa.length < 7) {
      plateStatus.textContent = 'Informe uma placa válida.';
      return;
    }
    plateStatus.textContent = 'Consultando placa...';
    try {
      const response = await fetch(`/api/veiculos/placa/${placa}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Não foi possível consultar a placa.');
      plateInput.value = data.placa || placa;
      vehicleDescription.value = data.veiculo_descricao || vehicleDescription.value;
      plateStatus.textContent = 'Dados do veículo carregados.';
    } catch (error) {
      plateStatus.textContent = error.message;
    }
  }

  plateButton.addEventListener('click', consultarPlaca);
})();
</script>
{% endblock %}

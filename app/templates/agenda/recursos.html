{% extends 'base.html' %}{% block content %}<div class="page-header"><div><h2>Boxes e recursos</h2></div></div>
<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid-2"><label>Nome<input name="nome" required maxlength="100"></label><label>Tipo<select name="tipo"><option>BOX</option><option>ELEVADOR</option><option>ALINHADOR</option><option>TECNICO</option><option>OUTRO</option></select></label></div><label>Observações<textarea name="observacoes"></textarea></label><button>Cadastrar recurso</button></form>
<div class="table-card"><table class="table"><thead><tr><th>Nome</th><th>Tipo</th><th>Situação</th></tr></thead><tbody>{% for item in resources %}<tr><td>{{ item.nome }}</td><td>{{ item.tipo }}</td><td>{{ 'Ativo' if item.ativo else 'Inativo' }}</td></tr>{% else %}<tr><td colspan="3">Nenhum recurso cadastrado.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="page-header"><div><h2>{{ 'Editar peça' if product else 'Nova peça' }}</h2></div></div>
<div class="card">
  <form method="post">
    <div class="form-grid-3">
      <label>Código<input type="text" name="codigo" value="{{ product.codigo if product else '' }}" required></label>
      <label>Nome<input type="text" name="nome" value="{{ product.nome if product else '' }}" required></label>
      <label>Categoria<input type="text" name="categoria" value="{{ product.categoria if product else '' }}"></label>
      <label>Marca<input type="text" name="marca" value="{{ product.marca if product else '' }}"></label>
      <label>Unidade<input type="text" name="unidade" value="{{ product.unidade if product else 'UN' }}"></label>
      <label>Custo<input type="number" step="0.01" name="custo" value="{{ product.custo if product else 0 }}"></label>
      <label>Preço de venda<input type="number" step="0.01" name="preco_venda" value="{{ product.preco_venda if product else 0 }}"></label>
    </div>
    <label class="checkbox"><input type="checkbox" name="ativo" {% if not product or product.ativo %}checked{% endif %}>Ativa</label>
    <div class="actions"><button type="submit">Salvar</button><a class="button secondary" href="{{ url_for('web.products_index') }}">Cancelar</a></div>
  </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Catálogo</span>
    <h2>{{ 'Editar peça' if product else 'Nova peça' }}</h2>
  </div>
</div>

<div class="card asymmetric">
  <form method="post">
    <h3 style="margin-bottom: 24px;">Dados da Peça</h3>
    
    <div class="form-grid-3">
      <label>Código
        <input type="text" name="codigo" value="{{ product.codigo if product else '' }}" required>
      </label>
      <label>Nome
        <input type="text" name="nome" value="{{ product.nome if product else '' }}" required>
      </label>
      <label>Categoria
        <input type="text" name="categoria" value="{{ product.categoria if product else '' }}">
      </label>
      
      <label>Marca
        <input type="text" name="marca" value="{{ product.marca if product else '' }}">
      </label>
      <label>Unidade
        <input type="text" name="unidade" value="{{ product.unidade if product else 'UN' }}">
      </label>
      <label>NCM
        <input type="text" name="ncm" list="lista-ncm" class="form-control" value="{{ product.ncm if product else '' }}">
      </label>
      <label>CFOP
        <input type="text" name="cfop" list="lista-cfop" value="{{ product.cfop if product else '' }}">
      </label>
      <label>Custo
        <input type="number" step="0.01" name="custo" value="{{ product.custo if product else 0 }}">
      </label>
      
      <label>Preço de venda
        <input type="number" step="0.01" name="preco_venda" value="{{ product.preco_venda if product else 0 }}">
      </label>
      <label>Estoque atual
        <input type="number" step="0.01" min="0" name="estoque_atual" value="{{ product.estoque_atual if product else 0 }}">
      </label>
      <label>Estoque mínimo
        <input type="number" step="0.01" min="0" name="estoque_minimo" value="{{ product.estoque_minimo if product else 0 }}">
      </label>
      
      <!-- Checkbox corrigido: Em linha, sem esticar (width: 18px), e alinhado na base do Grid -->
      <div style="display: flex; align-items: flex-end; padding-bottom: 12px;">
        <label style="display: flex; flex-direction: row; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" name="ativo" style="width: 18px; height: 18px; margin: 0; cursor: pointer;" {% if not product or product.ativo %}checked{% endif %}>
          <span style="font-size: 15px; color: var(--color-graphite); font-weight: 500;">Peça Ativa no sistema</span>
        </label>
      </div>
    </div>
    
    <div class="actions" style="margin-top: 40px;">
      <button type="submit">Salvar Peça</button>
      <a class="button secondary" href="{{ url_for('web.products_index') }}">Cancelar</a>
    </div>
  </form>
</div>
<!-- Lista Fixa de CFOPs (Sefaz) -->
<datalist id="lista-cfop">
    <!-- Entradas -->
    <option value="1102">1102 - Compra para comercialização (Dentro do Estado)</option>
    <option value="1403">1403 - Compra para comercialização sujeita a ST</option>
    <option value="2102">2102 - Compra para comercialização (Fora do Estado)</option>
    <option value="2403">2403 - Compra para comercialização sujeita a ST (Fora do Estado)</option>
    
    <!-- Saídas (Vendas) -->
    <option value="5102">5102 - Venda de mercadoria de terceiros</option>
    <option value="5405">5405 - Venda de mercadoria sujeita a ST</option>
    <option value="6102">6102 - Venda de mercadoria (Interestadual)</option>
    <option value="6404">6404 - Venda de mercadoria sujeita a ST (Interestadual)</option>
    
    <!-- Devoluções e Garantias -->
    <option value="5202">5202 - Devolução de compra para comercialização</option>
    <option value="5411">5411 - Devolução de compra sujeita a ST</option>
    <option value="6202">6202 - Devolução de compra (Interestadual)</option>
    <option value="6411">6411 - Devolução de compra sujeita a ST (Interestadual)</option>
    <option value="5556">5556 - Devolução de material de uso ou consumo</option>
    
    <!-- Consertos e Outros -->
    <option value="5915">5915 - Remessa para conserto ou reparo</option>
    <option value="5916">5916 - Retorno de mercadoria recebida para conserto</option>
    <option value="5949">5949 - Outra saída (não especificada)</option>
</datalist>

<!-- Lista Fixa de NCMs Específicos para Auto Center (Siscomex) -->
<datalist id="lista-ncm">

    <option value="34029090">34029090 - Limpa Ar Condicionado / Produtos de limpeza</option>
    <option value="40103100">40103100 - Correias de transmissão (Alternador, etc)</option>
    <option value="40111000">40111000 - Pneus novos para automóveis</option>
    <option value="40169990">40169990 - Buchas, coxins e peças de borracha</option>
    <option value="73181500">73181500 - Parafusos, pinos ou pernos</option>
    <option value="73261900">73261900 - Abraçadeiras de aço/ferro</option>
    <option value="84212300">84212300 - Filtros de Óleo e Combustível</option>
    <option value="84213990">84213990 - Filtros de Ar Condicionado / Cabine</option>
    <option value="84219999">84219999 - Filtros de Ar do Motor</option>
    <option value="84818021">84818021 - Válvulas termostáticas</option>
    <option value="84821090">84821090 - Rolamentos de esferas</option>
    <option value="84835090">84835090 - Tensores e Polias (Kit Correia Dentada)</option>
    <option value="85111000">85111000 - Velas de ignição</option>
    <option value="85369090">85369090 - Terminais e conectores elétricos</option>
    <option value="85443000">85443000 - Jogos de cabos de velas</option>
    <option value="87083019">87083019 - Pastilhas e Sapatas de Freio</option>
    <option value="87083090">87083090 - Discos, tambores e cilindros de freio</option>
    <option value="87087090">87087090 - Cubos de roda</option>
    <option value="87088000">87088000 - Amortecedores, molas e bieletas</option>
    <option value="87089490">87089490 - Terminais e caixas de direção</option>
    <option value="87089990">87089990 - Bandejas, pivôs, suportes e outras peças</option>
</datalist>
<!-- Lista Fixa de Natureza da Operação -->
<datalist id="lista-natureza">
    <option value="Venda de mercadoria">Venda de mercadoria</option>
    <option value="Venda de peças">Venda de peças</option>
    <option value="Devolução de compra">Devolução de compra</option>
    <option value="Devolução de venda">Devolução de venda</option>
    <option value="Remessa para conserto">Remessa para conserto</option>
    <option value="Retorno de conserto">Retorno de conserto</option>
    <option value="Outras saídas">Outras saídas</option>
</datalist>
{% endblock %}

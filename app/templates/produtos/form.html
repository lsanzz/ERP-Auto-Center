{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Catálogo</span>
    <h2>{{ 'Editar peça' if product else 'Nova peça' }}</h2>
  </div>
</div>

<div class="card asymmetric">
  <form method="post">
    <h3 style="margin-bottom: 24px;">Dados da Peça</h3>
    
    <div class="form-grid-3">
      <label>Código
        <input type="text" name="codigo" value="{{ product.codigo if product else '' }}" required>
      </label>
      <label>Nome
        <input type="text" name="nome" value="{{ product.nome if product else '' }}" required>
      </label>
      <label>Categoria
        <input type="text" name="categoria" value="{{ product.categoria if product else '' }}">
      </label>
      
      <label>Marca
        <input type="text" name="marca" value="{{ product.marca if product else '' }}">
      </label>
      <label>Unidade
        <input type="text" name="unidade" value="{{ product.unidade if product else 'UN' }}">
      </label>
      <label>Custo
        <input type="number" step="0.01" name="custo" value="{{ product.custo if product else 0 }}">
      </label>
      
      <label>Preço de venda
        <input type="number" step="0.01" name="preco_venda" value="{{ product.preco_venda if product else 0 }}">
      </label>
      
      <!-- Checkbox corrigido: Em linha, sem esticar (width: 18px), e alinhado na base do Grid -->
      <div style="display: flex; align-items: flex-end; padding-bottom: 12px;">
        <label style="display: flex; flex-direction: row; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" name="ativo" style="width: 18px; height: 18px; margin: 0; cursor: pointer;" {% if not product or product.ativo %}checked{% endif %}>
          <span style="font-size: 15px; color: var(--color-graphite); font-weight: 500;">Peça Ativa no sistema</span>
        </label>
      </div>
    </div>
    
    <div class="actions" style="margin-top: 40px;">
      <button type="submit">Salvar Peça</button>
      <a class="button secondary" href="{{ url_for('web.products_index') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

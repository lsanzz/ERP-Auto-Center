{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div>
    <h2>{{ 'Editar forma de pagamento' if method else 'Nova forma de pagamento' }}</h2>
    <p class="muted">Configure tipo, parcelamento e limite máximo de parcelas.</p>
  </div>
</div>
<div class="card">
  <form method="post">
    <div class="form-grid-2">
      <label>Nome
        <input type="text" name="nome" value="{{ method.nome if method else '' }}" required>
      </label>
      <label>Tipo
        <select name="tipo" id="tipo-pagamento">
          {% set current_type = method.tipo if method else 'OUTRO' %}
          {% for option in ['DINHEIRO', 'PIX', 'DEBITO', 'CREDITO', 'OUTRO'] %}
          <option value="{{ option }}" {% if current_type == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div id="parcelamento-box">
      <div class="form-grid-2">
        <label class="checkbox">
          <input type="checkbox" name="permite_parcelamento" id="permite-parcelamento" {% if method and method.permite_parcelamento %}checked{% elif not method and (method is none) %}{% endif %}>
          Permite parcelamento
        </label>
        <label>Parcelas máximas
          <input type="number" min="1" max="24" name="parcelas_maximas" id="parcelas-maximas" value="{{ method.parcelas_maximas if method else 1 }}">
        </label>
      </div>
    </div>

    <label class="checkbox">
      <input type="checkbox" name="ativo" {% if not method or method.ativo %}checked{% endif %}>
      Ativa
    </label>

    <div class="actions">
      <button type="submit">Salvar</button>
      <a class="button secondary" href="{{ url_for('web.payment_methods_index') }}">Cancelar</a>
    </div>
  </form>
</div>
<script>
(() => {
  const tipo = document.getElementById('tipo-pagamento');
  const box = document.getElementById('parcelamento-box');
  const permite = document.getElementById('permite-parcelamento');
  const parcelas = document.getElementById('parcelas-maximas');

  function sync() {
    const isCredito = tipo.value === 'CREDITO';
    box.style.display = isCredito ? 'block' : 'none';
    if (!isCredito) {
      permite.checked = false;
      parcelas.value = 1;
    } else if (!permite.checked) {
      permite.checked = true;
    }
  }

  tipo.addEventListener('change', sync);
  sync();
})();
</script>
{% endblock %}

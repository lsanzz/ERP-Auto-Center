<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · {{ system_settings.company_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>{{ system_settings.company_name }}</h1>
    <p>Faça login para acessar o sistema.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" class="action-form" style="display: grid; gap: 20px; margin-top: 24px;">
      <label style="display: grid; gap: 8px; color: var(--muted); font-size: 14px;">Usuário
        <input type="text" name="username" required>
      </label>
      <label style="display: grid; gap: 8px; color: var(--muted); font-size: 14px;">Senha
        <input type="password" name="password" required>
      </label>
      <button type="submit" style="margin-top: 8px; padding: 14px; font-size: 16px; font-weight: 700;">Entrar</button>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · {{ system_settings.company_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=3">
  <style>
    /* Forçar estilos do login para ignorar cache antigo do CSS */
    .login-body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f9 !important; /* Fundo claro para combinar com as telas operacionais */
    }
    .login-card {
      width: min(420px, calc(100vw - 32px));
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 12px !important;
      padding: 40px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
      color: #17191f !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-logo {
      width: 260px;
      height: auto;
      margin-bottom: 24px;
    }
    .login-card h1 {
      margin-top: 0;
      color: #17191f !important;
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-card p {
      color: #64748b !important;
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }
    .login-card label {
      display: grid;
      gap: 6px;
      color: #475569 !important;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      text-align: left;
    }
    .login-card form {
      width: 100%;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      border-radius: 8px !important;
      border: 1px solid #cbd5e1 !important;
      background: #ffffff !important;
      color: #1e293b !important;
      transition: all 0.2s;
    }
    .login-card input:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1) !important;
      outline: none;
    }
    .login-card button {
      width: 100%;
      margin-top: 12px;
      padding: 14px !important;
      border-radius: 8px !important;
      background: #17191f !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 16px !important;
      border: none !important;
      cursor: pointer;
    }
    .login-card button:hover {
      background: #2d3748 !important;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="{{ system_settings.company_name }}" class="login-logo">
    <p>Faça login para acessar o sistema.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}" style="background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center; width: 100%;">
          {{ message }}
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" style="display: grid; gap: 16px;">
      <label>Usuário
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar no Sistema</button>
    </form>
  </div>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Catálogo</span>
    <h2>{{ 'Editar serviço' if service else 'Novo serviço' }}</h2>
    <p class="muted" style="margin-top: 8px;">Cadastro simplificado de serviços da oficina.</p>
  </div>
</div>

<div class="card asymmetric">
  <form method="post">
    <h3 style="margin-bottom: 24px;">Dados do Serviço</h3>
    
    <div class="form-grid-3">
      <!-- Ocupa duas colunas para dar mais espaço ao texto longo -->
      <label style="grid-column: span 2;">Nome
        <input type="text" name="nome" value="{{ service.nome if service else '' }}" required>
      </label>
      <label>Preço base
        <input type="number" step="0.01" name="preco_base" value="{{ service.preco_base if service else 0 }}" required>
      </label>
    </div>

    <label style="margin-top: 12px;">Descrição
      <textarea name="descricao" rows="3">{{ service.descricao if service else '' }}</textarea>
    </label>
    
    <!-- Checkbox corrigido -->
    <div style="margin-top: 24px;">
      <label style="display: flex; flex-direction: row; align-items: center; gap: 10px; cursor: pointer;">
        <input type="checkbox" name="ativo" style="width: 18px; height: 18px; margin: 0; cursor: pointer;" {% if not service or service.ativo %}checked{% endif %}>
        <span style="font-size: 15px; color: var(--color-graphite); font-weight: 500;">Serviço Ativo no sistema</span>
      </label>
    </div>

    <div class="actions" style="margin-top: 40px;">
      <button type="submit">Salvar Serviço</button>
      <a class="button secondary" href="{{ url_for('web.services_index') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

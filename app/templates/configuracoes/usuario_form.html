{% extends 'base.html' %}
{% block content %}
<div class="page-header"><div><span class="eyebrow">Acessos</span><h2>{{ 'Editar usuário' if user else 'Novo usuário' }}</h2><p class="muted">Defina o perfil que controla as áreas disponíveis para essa conta.</p></div></div>
<div class="card">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid-2">
      <label>Nome completo<input name="nome" value="{{ user.nome if user else '' }}" required></label>
      <label>Usuário<input name="username" value="{{ user.username if user else '' }}" required autocomplete="username"></label>
      <label>Perfil<select name="role">{% for value, label in [('ADMINISTRADOR','Administrador'),('RECEPCIONISTA','Recepcionista'),('MECANICO','Mecânico'),('ESTOQUISTA','Estoquista'),('FINANCEIRO','Financeiro')] %}<option value="{{ value }}" {% if (user and user.role == value) or (not user and value == 'MECANICO') %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
      <label>Senha {{ '(deixe em branco para manter)' if user else '' }}<input type="password" name="password" {% if not user %}required{% endif %} minlength="12" autocomplete="new-password"></label>
    </div>
    <label class="checkbox"><input type="checkbox" name="ativo" {% if not user or user.ativo %}checked{% endif %}> Usuário ativo</label>
    <div class="actions"><button type="submit">Salvar usuário</button><a class="button secondary" href="{{ url_for('web.settings_index') }}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
